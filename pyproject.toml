[project]
name = "l-space-librarian"
version = "0.1.0"
description = "The Librarian that collects consumable items (Readwise Reader + YouTube Watch Later) into L-space — a local SQLite index (l-space.db) for prioritising what to read/watch."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastcore>=2.2",
    "readwise-tools",
    "youtube-transcript-api>=1.0.0",
]

[project.scripts]
cs-init = "consume_selection.db:main"
cs-ingest = "consume_selection.ingest:main"
cs-groundtruth = "consume_selection.groundtruth:main"
cs-label = "consume_selection.labels:main"
cs-fts = "consume_selection.fts:main"
cs-embed = "consume_selection.embed:main"
cs-match = "consume_selection.embed:main"
cs-watchlater = "consume_selection.watchlater:main"
cs-mismatch = "consume_selection.mismatch:main"
cs-librarything = "consume_selection.librarything:main"
cs-toread = "consume_selection.toread:main"
cs-podcasts = "consume_selection.podcasts:main"
cs-hopswiki = "consume_selection.hopswiki:main"

# NO `[project.optional-dependencies]`. [REMOVED 2026-09-02]
#
# There used to be an `embed` extra here declaring `sentence-transformers>=3.0`
# and `numpy>=1.26`, for the in-process embedding backend. It is gone, and the
# reason is a uv behaviour that is easy to be caught by:
#
#   **uv builds a UNIVERSAL lock that must resolve every declared extra, even
#   one you never install.** So on a machine that resolves offline against a
#   fixed wheel store, an extra whose dependencies are absent makes the WHOLE
#   project unresolvable — every `cs-*` command, not just the embedding one.
#   `uv run --no-extra embed` does not help: that flag governs the sync, not
#   the lock.
#
# That is exactly the state of the Mac Mini's Hoggle container, which installs
# with `no-index` + `find-links=/opt/wheels` and has no `sentence-transformers`
# (it pulls torch, ~2-3 GB, gated only on sys_platform=='linux'). Measured
# 2026-09-02: with this block present, all five `cs-*` entry points fail to
# resolve; with it removed and nothing else changed, all five run.
#
# NOTHING IS LOST BY REMOVING IT, and that is why this is the fix rather than a
# workaround. The comment that used to sit below this block already said so:
# the preferred embedding path is the **Ollama backend**
# (`CONSUME_EMBED_BACKEND=ollama`) — pure HTTP, no torch, no wheels at all —
# and the extra was only the in-process fallback. `numpy` also remains
# available wherever it is actually wanted; it is in the container's approved
# store and imports fine under `uv run`.
#
# If the in-process backend is ever needed again, install its dependencies
# explicitly at the point of use rather than re-declaring an extra:
#
#     uv run --with sentence-transformers cs-embed          # networked machines
#
# which keeps them out of the lock and therefore out of every other machine's
# resolution.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["consume_selection"]

# Reuse the existing Readwise CLI/client rather than reinventing API access.
# Local path dependency for now; swap to the public git repo
# (Hopsakee/readwise-tools) for portability — same pattern as _TOLIBRARY_PODCAST.
[tool.uv.sources]
readwise-tools = { path = "../readwise-tools", editable = true }

# NOTE on embeddings, kept because the guidance outlived the extra it described:
# `sentence-transformers` pulls `torch`, which on Linux drags in ~3GB of
# nvidia/CUDA wheels (gated only on sys_platform=='linux'). The preferred
# embedding path is the Ollama backend (CONSUME_EMBED_BACKEND=ollama) — pure
# HTTP, NO torch at all. Use that on the MacMini. If you genuinely need the
# in-process backend on a networked machine, install CPU-only torch first:
#   uv pip install torch --index-url https://download.pytorch.org/whl/cpu
#   uv run --with sentence-transformers cs-embed
