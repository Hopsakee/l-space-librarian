<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18">
  <!-- A list with the first item ticked. iOS rounds the corners itself. -->
  <rect width="18" height="18" fill="#fff"/>
  <g stroke="#000" stroke-width=".45">
    <rect x="3" y="3.8" width="2.4" height="2.4" rx=".4" fill="#000"/>
    <rect x="3" y="7.8" width="2.4" height="2.4" rx=".4" fill="#fff"/>
    <rect x="3" y="11.8" width="2.4" height="2.4" rx=".4" fill="#fff"/>
  </g>
  <path d="M3.6 5 4.1 5.6 4.9 4.3" fill="none" stroke="#fff" stroke-width=".4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#000">
    <rect x="7" y="4.5" width="8" height="1" rx=".5"/>
    <rect x="7" y="8.5" width="8" height="1" rx=".5"/>
    <rect x="7" y="12.5" width="8" height="1" rx=".5"/>
  </g>
</svg>
